<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>e-Seva | Officer Login</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.login-container{
    width:420px;
    background:white;
    padding:35px;
    border-radius:12px;
    box-shadow:0 8px 30px rgba(0,0,0,0.10);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    color:#123f73;
    font-size:28px;
}

.logo h1 span{
    color:#168047;
}

.logo p{
    color:#777;
    font-size:13px;
    margin-top:5px;
}

.officer-title{
    text-align:center;
    color:#123f73;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:7px;
    font-weight:600;
    color:#304b63;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccd6df;
    border-radius:6px;
    font-size:14px;
}

input:focus{
    outline:none;
    border-color:#168047;
}

.login-btn{
    width:100%;
    padding:13px;
    background:#123f73;
    color:white;
    border:none;
    border-radius:6px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:hover{
    background:#0d315a;
}

.message{
    display:none;
    margin-bottom:15px;
    padding:12px;
    border-radius:6px;
    text-align:center;
    font-size:13px;
}

.error{
    background:#fff0f0;
    color:#c62828;
}

.demo{
    margin-top:20px;
    padding:12px;
    background:#eef5ff;
    border-left:4px solid #123f73;
    font-size:12px;
    color:#40556a;
}

</style>

</head>

<body>

<div class="login-container">

    <div class="logo">

        <h1>
            <span>e-</span>Seva Portal
        </h1>

        <p>
            Officer Administration Portal
        </p>

    </div>

    <h2 class="officer-title">
        Officer Login
    </h2>

    <div id="message" class="message"></div>

    <form id="officerLoginForm">

        <div class="form-group">

            <label>Officer ID</label>

            <input
                type="text"
                id="officerId"
                placeholder="Enter Officer ID"
                required
            >

        </div>

        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required
            >

        </div>

        <button
            type="submit"
            class="login-btn"
        >
            Login
        </button>

    </form>

    <div class="demo">

        <strong>Demo Officer</strong><br><br>

        Officer ID: <b>OFF001</b><br>

        Password: <b>officer123</b>

    </div>

</div>


<script>

document
.getElementById("officerLoginForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const officerId =
        document.getElementById("officerId").value.trim();

    const password =
        document.getElementById("password").value.trim();

    const message =
        document.getElementById("message");

    message.style.display = "none";

    try {

        const response = await fetch(
            "http://127.0.0.1:5000/officer/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    officer_id: officerId,
                    password: password
                })
            }
        );

        const result = await response.json();

        if (result.success === true) {

            // Save officer information
            localStorage.setItem(
                "officerLoggedIn",
                "true"
            );

            localStorage.setItem(
                "officer",
                JSON.stringify(result.officer)
            );

            localStorage.setItem(
                "officerId",
                result.officer.officer_id
            );

            localStorage.setItem(
                "officerName",
                result.officer.name
            );

            localStorage.setItem(
                "officerDepartment",
                result.officer.department
            );

            localStorage.setItem(
                "officerStage",
                result.officer.stage_name
            );

            // Open Officer Dashboard
            window.location.href =
                "officer-dashboard.html";

        } else {

            message.style.display = "block";

            message.className =
                "message error";

            message.textContent =
                result.message ||
                "Invalid Officer ID or Password.";

        }

    } catch (error) {

        console.error(
            "Officer Login Error:",
            error
        );

        message.style.display = "block";

        message.className =
            "message error";

        message.textContent =
            "Unable to connect to server. Please start Flask backend.";

    }

});

</script>

</body>

</html>
